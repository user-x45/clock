<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時計</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#000; --fg:#f2f2f2; --sub:rgba(255,255,255,.95); --acc:#4fd1c5; --warn:#f6ad55; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  main { height: 100%; display: flex; flex-direction: row; align-items: stretch; gap: 2vw;
    padding: calc(2.5vh + env(safe-area-inset-top)) calc(3vw + env(safe-area-inset-right)) calc(4.5vh + env(safe-area-inset-bottom)) calc(3vw + env(safe-area-inset-left)); }
  #left { gap: 1.6vh; flex: 1.45; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #right { overflow: hidden; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.5vh; }
  .card { overflow: hidden; background: rgba(0,0,0,.28); border-radius: 12px; padding: 1.2vh 1.1vw; text-shadow: none; }
  .card h3 { font-size: min(1.4vw, 2.6vh); font-weight: 400; color: var(--sub); letter-spacing: .1em; margin-bottom: .6vh; }
  #hourly { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; text-align: center; font-size: min(1.9vw, 3.6vh); line-height: 1.25; }
  #hourly { font-family: "Montserrat", "Zen Kaku Gothic New", sans-serif; font-weight: 300; }
  #hourly .h, #hourly .p { color: var(--sub); font-size: .75em; }
  #hourly i { display: block; color: var(--acc); margin: .15em 0; }
  #tomorrow { display: flex; align-items: center; flex-wrap: wrap; gap: .2em .7em; font-size: min(2.3vw, 4.2vh); }
  #tomorrow i { color: var(--acc); } #tomorrow .p { color: var(--sub); font-size: .7em; }
  #newslist { list-style: none; padding: 0; }
  #newslist li { font-size: 1em; line-height: 1.35; padding: .5vh 0; border-bottom: 1px solid rgba(255,255,255,.12);
  }
  #newslist li:last-child { border-bottom: 0; }
  #time { font-family: "Montserrat", "Zen Kaku Gothic New", sans-serif; font-size: min(12.5vw, 32vh); font-weight: 200; line-height: 1; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #sec { font-size: .45em; color: var(--acc); margin-left: .08em; }
  #date { white-space: nowrap; line-height: 1.2; letter-spacing: .08em; font-size: min(3.4vw, 7vh); font-weight: 300; }
  #wday { margin-left: .5em; color: var(--acc); }
  #weather { line-height: 1.2; font-size: min(3vw, 6vh); font-weight: 400; color: var(--fg); white-space: nowrap; }
  #weather .city { color: var(--sub); font-size: .72em; font-weight: 500; margin-right: .6em; }
  #weather .wi { margin-right: .35em; color: var(--acc); }
  #today { white-space: nowrap; display: flex; align-items: baseline; justify-content: center; gap: .7em; font-size: min(2.4vw, 4.8vh); }
  #today[hidden] { display: none; }
  #today .lbl { font-size: .72em; font-weight: 500; color: var(--sub); white-space: nowrap; letter-spacing: .1em; }
  #todayname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .5s; }
  #weather.stale { opacity: .5; }
  #newslist li[data-link] { cursor: pointer; }
  /* ニュースのQRコード表示 */
  #qr { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.8); text-shadow: none; }
  #qr[hidden] { display: none; }
  #qrbox { background: #fff; color: #111; border-radius: 16px; padding: 2.6vh 2.4vw; display: flex; align-items: center; gap: 3vw; max-width: 94vw; max-height: 94vh; }
  #qrcv { width: min(68vh, 36vw); height: min(68vh, 36vw); image-rendering: pixelated; flex: none; }
  #qrcv[hidden] { display: none; }
  #qrside { max-width: 36vw; display: flex; flex-direction: column; gap: 1.6vh; }
  #qrtitle { font-size: min(2.4vw, 4.6vh); font-weight: 500; line-height: 1.4; }
  #qrnote { font-size: min(1.5vw, 2.8vh); color: #555; }
  #qrurl { font-size: min(1.1vw, 2vh); color: #777; word-break: break-all; }
  @media (orientation: portrait) {
    #qrbox { flex-direction: column; } #qrcv { width: min(70vw, 46vh); height: min(70vw, 46vh); }
    #qrside { max-width: 80vw; } #qrtitle { font-size: 4vw; } #qrnote { font-size: 3vw; } #qrurl { font-size: 2.2vw; }
  }
  /* 時間帯ごとの背景(早朝5-9 / 昼9-16 / 夕方16-19 / 夜19-5) */
  body[data-p="morning"] { --fg:#fffaf0; --sub:rgba(255,255,255,.95); --acc:#fff0c2; }
  body[data-p="day"]     { --fg:#ffffff; --sub:rgba(255,255,255,.95); --acc:#ffe58a; }
  body[data-p="evening"] { --fg:#fff7ee; --sub:rgba(255,255,255,.95); --acc:#ffd89b; }
  /* 背景スライドショー(background/1.jpeg〜10.jpeg を10秒ごとにクロスフェード) */
  #bgs { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, #000106, #08142b); }
  #bgs .layer { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease-in-out; }
  #bgs .layer.on { opacity: 1; }
  #bgs::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); } /* 文字を読みやすくする暗幕 */
  main { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,.75), 0 2px 14px rgba(0,0,0,.55); }
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; z-index: 10; }
  #status { z-index: 2; text-shadow: 0 1px 6px rgba(0,0,0,.4); position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--sub); }
  #status.warn { color: var(--warn); }
  /* 地震通知 */
  #alert { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none; text-align: center; color: #fff;
    display: flex; flex-direction: column; gap: .6vh; padding: calc(2.5vh + env(safe-area-inset-top)) 4vw 2.5vh;
    border-radius: 0 0 18px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.45); text-shadow: none;
    transform: translateY(-110%); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  #alert.show { transform: translateY(0); }
  #alert.eew { background: rgba(190,20,20,.97); }
  #alert.quake { background: rgba(200,95,10,.97); }
  #atitle { font-size: min(2.2vw, 4vh); font-weight: 500; letter-spacing: .15em; }
  #amain { font-size: min(5.5vw, 11vh); font-weight: 500; line-height: 1.15; }
  #asub { font-size: min(2.4vw, 4.4vh); font-weight: 400; line-height: 1.35; white-space: pre-line; }
  @media (orientation: portrait) {
    main::before { content: "横向きにしてください"; position: fixed; top: 12px; font-size: 13px; color: var(--sub); }
    #time { font-size: 17vw; }
    #date { font-size: 5vw; }
    #weather { font-size: 5vw; }
    #right { display: none; }
    main { flex-direction: column; }
  }
</style>
</head>
<body data-p="night">
<div id="bgs"><div class="layer" id="bgA"></div><div class="layer" id="bgB"></div></div>
<main>
  <div id="left">
    <div id="time">--:--<span id="sec">--</span></div>
    <div id="date">----年--月--日<span id="wday">-曜日</span></div>
    <div id="weather"><span class="city">札幌</span>天気を取得中…</div>
    <div id="today" hidden><span class="lbl">今日は何の日</span><span id="todayname"></span></div>
  </div>
  <div id="right">
    <div class="card"><h3>これからの天気(2時間ごと)</h3><div id="hourly"></div></div>
    <div class="card"><h3>明日の天気</h3><div id="tomorrow">取得中…</div></div>
    <div class="card"><h3 id="newsh">ニュース</h3><ul id="newslist"><li>取得中…</li></ul></div>
  </div>
</main>
<div id="qr" hidden><div id="qrbox"><canvas id="qrcv"></canvas><div id="qrside"><div id="qrtitle"></div><div id="qrnote">スマートフォンのカメラで読み取ってください(タップで閉じる)</div><div id="qrurl"></div></div></div></div>
<div id="alert"><div id="atitle"></div><div id="amain"></div><div id="asub"></div></div>
<div id="dim"></div>
<div id="status">時刻を同期中…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
  const SYNC_INTERVAL = 5 * 60 * 1000;   // 5分ごとに同期
  const SAMPLES = 3;                      // 往復遅延が最小のサンプルを採用
  // 夜間の自動減光(端末のローカル時刻)
  const NIGHT_START = 22;  // 22:00から
  const NIGHT_END = 6;     // 6:00まで
  const DIM_LEVEL = 0.75;  // 暗さ(0〜1、大きいほど暗い)

  // 時刻ソース(順番に試行、失敗したら次へ)
  // 小数秒を3桁に揃えてからパース
  const iso = (t, utc) => Date.parse(String(t).replace(/(\.\d{3})\d+/, "$1") + (utc && !/[zZ]|[+-]\d\d:?\d\d$/.test(t) ? "Z" : ""));
  const SOURCES = [
    { url: "https://timeapi.io/api/time/current/zone?timeZone=UTC",
      parse: async r => { const j = await r.json(); return iso(j.dateTime || j.currentLocalTime, true); } },
    { url: "https://time.now/developer/api/timezone/Etc/UTC",
      parse: async r => { const j = await r.json(); return iso(j.utc_datetime || j.datetime, true); } }
  ];

  let nLast = 0, nErr = false, lastDay = null;
  let qState = 0, alertOn = false; // qState: 0=接続中 1=接続済 2=切断
  let offset = 0, lastSync = null, lastErr = false, accuracy = null;
  const $ = id => document.getElementById(id);
  const now = () => Date.now() + offset;

  // 取得失敗時の再試行(10秒後 → 30秒後 → 1分後。それでも失敗なら次の定期取得を待つ)
  const RETRY_DELAYS = [10000, 30000, 60000];
  const retryN = {}, retryT = {};
  function retryLater(name, fn) {
    const n = retryN[name] || 0;
    clearTimeout(retryT[name]);
    if (n >= RETRY_DELAYS.length) { retryN[name] = 0; return; }
    retryN[name] = n + 1;
    retryT[name] = setTimeout(fn, RETRY_DELAYS[n]);
  }
  function retryOk(name) { retryN[name] = 0; clearTimeout(retryT[name]); }

  async function sample(src) {
    const t0 = performance.now();
    const r = await fetch(src.url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const ms = await src.parse(r);
    if (!isFinite(ms)) throw new Error("parse");
    const rtt = performance.now() - t0;
    return { rtt, offset: ms + rtt / 2 - Date.now() };
  }

  async function sync() {
    for (const src of SOURCES) {
      try {
        const results = [];
        for (let i = 0; i < SAMPLES; i++) results.push(await sample(src));
        const best = results.reduce((a, b) => a.rtt < b.rtt ? a : b);
        offset = best.offset;
        accuracy = best.rtt / 2;
        lastSync = Date.now();
        lastErr = false; retryOk("sync");
        return renderStatus();
      } catch (e) { /* 次のソースへ */ }
    }
    lastErr = true; retryLater("sync", sync);
    renderStatus();
  }

  const p2 = n => String(n).padStart(2, "0");
  const WD = ["日","月","火","水","木","金","土"];

  function render() {
    const d = new Date(now());
    $("time").firstChild.nodeValue = p2(d.getHours()) + ":" + p2(d.getMinutes());
    $("sec").textContent = p2(d.getSeconds());
    $("date").firstChild.nodeValue = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    $("wday").textContent = WD[d.getDay()] + "曜日";
    // 日付が変わった瞬間に天気・ニュース・今日は何の日をまとめて再取得
    const dk = d.getDate();
    if (lastDay !== null && dk !== lastDay) { weather(); news(); today(); }
    lastDay = dk;
    const h = d.getHours();
    document.body.dataset.p = h >= 5 && h < 9 ? "morning" : h >= 9 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night";
    const night = NIGHT_START > NIGHT_END ? (h >= NIGHT_START || h < NIGHT_END) : (h >= NIGHT_START && h < NIGHT_END);
    $("dim").style.opacity = (night && !alertOn) ? DIM_LEVEL : 0;
    setTimeout(render, 1000 - (now() % 1000) + 5); // 秒の境界に合わせて更新
  }

  function renderStatus() {
    const el = $("status");
    const f = t => { const d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()); };
    const c = nLast ? `ニュース取得 ${f(nLast)}` + (nErr ? "(再取得失敗)" : "") : (nErr ? "ニュース取得 失敗" : "ニュース取得中…");
    const a = lastSync ? `時刻取得 ${f(lastSync)}` + (lastErr ? "(再取得失敗)" : "") : "時刻取得 失敗(端末時刻を表示中)";
    const b = wLast ? `天気取得 ${f(wLast)}` + (wErr ? "(再取得失敗)" : "") : (wErr ? "天気取得 失敗" : "天気取得中…");
    const q = ["地震情報 接続中…", "地震情報 受信待機中", "地震情報 切断(再接続中)"][qState];
    el.textContent = a + "  ・  " + b + "  ・  " + c + "  ・  " + q;
    el.className = (lastErr || wErr || nErr || !lastSync || qState === 2) ? "warn" : "";
  }


  // ---- 札幌の天気(Open-Meteo / APIキー不要) ----
  const WEATHER_INTERVAL = 10 * 60 * 1000; // 10分ごと
  const WURL = "https://api.open-meteo.com/v1/forecast?latitude=43.0621&longitude=141.3544&current=temperature_2m,apparent_temperature,weather_code,is_day&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=2&timezone=Asia%2FTokyo";
  // Font Awesome(Free Solid)アイコン。夜間は月アイコンに切替
  const WMAP = (c, day) => c === 0 ? [day ? "fa-sun" : "fa-moon", "快晴", day ? "#f6c945" : "#cbd5e0"]
    : c <= 2 ? [day ? "fa-cloud-sun" : "fa-cloud-moon", "晴れ", day ? "#f6c945" : "#cbd5e0"]
    : c === 3 ? ["fa-cloud", "曇り", "#a0aec0"]
    : c <= 48 ? ["fa-smog", "霧", "#a0aec0"]
    : c <= 57 ? ["fa-cloud-rain", "霧雨", "#63b3ed"]
    : c <= 67 ? ["fa-cloud-showers-heavy", "雨", "#4299e1"]
    : c <= 77 ? ["fa-snowflake", "雪", "#bee3f8"]
    : c <= 82 ? ["fa-cloud-sun-rain", "にわか雨", "#63b3ed"]
    : c <= 86 ? ["fa-snowflake", "にわか雪", "#bee3f8"]
    : ["fa-cloud-bolt", "雷雨", "#ecc94b"];
  let wLast = 0, wErr = false;
  async function weather() {
    const el = $("weather");
    try {
      const r = await fetch(WURL, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(), c = j.current;
      const [icon, label, color] = WMAP(c.weather_code, c.is_day === 1);
      el.innerHTML = `<span class="city">札幌</span><i class="fa-solid ${icon} wi"></i>${label} ${Math.round(c.temperature_2m)}°C` +
        `<span class="city" style="margin-left:.6em">体感 ${Math.round(c.apparent_temperature)}°C</span>`;
      el.className = "";
      // 時間ごと(次の時刻から2時間おきに4件)
      const H = j.hourly, i0 = H.time.findIndex(t => t > c.time);
      let hh = "";
      for (let k = 0; k < 4; k++) {
        const i = i0 + k * 2; if (i0 < 0 || i >= H.time.length) break;
        const hr = parseInt(H.time[i].slice(11, 13), 10);
        const ic = WMAP(H.weather_code[i], hr >= 6 && hr < 18)[0];
        hh += `<div><div class="h">${hr}時</div><i class="fa-solid ${ic}"></i><div>${Math.round(H.temperature_2m[i])}°</div><div class="p">${H.precipitation_probability[i]}%</div></div>`;
      }
      $("hourly").innerHTML = hh;
      // 明日
      const D = j.daily, [dic, dlabel] = WMAP(D.weather_code[1], true);
      $("tomorrow").innerHTML = `<i class="fa-solid ${dic}"></i><span>${dlabel}</span><span>${Math.round(D.temperature_2m_max[1])}° / ${Math.round(D.temperature_2m_min[1])}°</span><span class="p">降水確率 ${D.precipitation_probability_max[1]}%</span>`;
      wLast = Date.now(); wErr = false; retryOk("weather"); renderStatus(); relayout();
    } catch (e) {
      wErr = true; retryLater("weather", weather); renderStatus();
      if (wLast) el.className = "stale"; // 取得失敗時は前回値を薄く表示
      else el.innerHTML = '<span class="city">札幌</span>天気を取得できません';
    }
  }

  // ---- ニュース(RSS → rss2json経由。APIキー不要) ----
  const NEWS_INTERVAL = 30 * 60 * 1000; // 30分ごと
  const FEEDS = [
    { name: "NHK", url: "https://www.nhk.or.jp/rss/news/cat0.xml" },
    { name: "Yahoo!ニュース", url: "https://news.yahoo.co.jp/rss/topics/top-picks.xml" }
  ];
  async function news() {
    for (const f of FEEDS) {
      try {
        const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(f.url), { cache: "no-store" });
        const j = await r.json();
        if (j.status !== "ok" || !j.items || !j.items.length) throw new Error("feed");
        const ul = $("newslist"); ul.textContent = "";
        j.items.slice(0, 3).forEach(it => { const li = document.createElement("li"); li.textContent = it.title; if (it.link) li.dataset.link = it.link; ul.appendChild(li); });
        $("newsh").textContent = "今日のニュース(" + f.name + ")";
        nLast = Date.now(); nErr = false; retryOk("news"); renderStatus(); relayout(); return;
      } catch (e) { /* 次のフィードへ */ }
    }
    nErr = true; retryLater("news", news); renderStatus();
    if (!nLast) { $("newslist").innerHTML = "<li>ニュースを取得できません</li>"; relayout(); }
  }

  // ---- 今日は何の日(ultimatecrazy.jp 公開API / キー不要) ----
  let anniv = [], aIdx = 0, aKey = "", aTry = 0;
  const mmdd = () => { const d = new Date(now()); return p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
  function showAnniv() {
    const box = $("today"), nm = $("todayname");
    if (!anniv.length) { box.hidden = true; relayout(); return; }
    box.hidden = false;
    nm.style.opacity = 0;
    setTimeout(() => { nm.textContent = anniv[aIdx % anniv.length]; nm.style.opacity = 1; relayout(); }, 300);
  }
  async function today() {
    aTry = Date.now();
    const key = mmdd();
    try {
      const r = await fetch(`https://ultimatecrazy.jp/whatstoday/api/${key}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      anniv = (j.anniversaries || []).map(a => a.name).filter(Boolean);
      aKey = key; aIdx = 0; retryOk("today"); showAnniv();
    } catch (e) { retryLater("today", today); /* 前回の表示を維持 */ }
  }
  setInterval(() => { if (anniv.length > 1) { aIdx++; showAnniv(); } }, 15000); // 15秒ごとに切替
  setInterval(() => { if (mmdd() !== aKey && Date.now() - aTry > 60000) today(); }, 30000); // 日付が変わったら再取得

  // ---- 文字サイズの自動調整(はみ出さない範囲で最大化) ----
  function fit(el, ok, lo, hi) {
    while (hi - lo > 0.5) {
      const m = (lo + hi) / 2;
      el.style.fontSize = m + "px";
      if (ok()) lo = m; else hi = m;
    }
    el.style.fontSize = lo + "px";
  }
  function layout() {
    const L = $("left"), W = L.clientWidth * 0.97, H = L.clientHeight;
    const one = (el, hMax, lo = 8) => fit(el, () => el.offsetWidth <= W && el.offsetHeight <= H * hMax, lo, 600);
    one($("time"), 0.46);
    one($("date"), 0.12);
    one($("weather"), 0.11);
    if (!$("today").hidden) one($("today"), 0.11, 12);
    const R = $("right");
    if (getComputedStyle(R).display === "none") return;
    const RH = R.clientHeight, cards = R.querySelectorAll(".card");
    R.querySelectorAll("h3").forEach(h => h.style.fontSize = Math.max(10, RH * 0.04) + "px");
    cards[0].style.flex = `0 0 ${RH * 0.32}px`;
    cards[1].style.flex = `0 0 ${RH * 0.17}px`;
    cards[2].style.flex = "1 1 0"; cards[2].style.minHeight = "0";
    [[cards[0], $("hourly"), 120], [cards[1], $("tomorrow"), 90], [cards[2], $("newslist"), 90]].forEach(([card, c, hi]) =>
      fit(c, () => card.scrollHeight <= card.clientHeight + 1 && c.scrollWidth <= c.clientWidth + 1, 8, hi));
  }
  let lq = 0;
  const relayout = () => { cancelAnimationFrame(lq); lq = requestAnimationFrame(layout); };
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", relayout);
  document.fonts && document.fonts.ready.then(relayout);

  // ---- 地震通知(P2P地震情報 WebSocket / キー不要) ----
  // 通知は画面上部からスライドして表示し、数秒後に自動で消える(操作不要)
  // ・緊急地震速報(警報): 石狩地方中部(札幌市北区を含む予報区)で震度3以上の予想
  // ・震度情報: 札幌市北区の観測点で震度3以上を観測
  const EQ_WS = "wss://api.p2pquake.net/v2/ws";
  const EQ_MIN = 30;                 // 震度3
  const EEW_AREA = /石狩地方中部/;
  const QUAKE_ADDR = /札幌(市)?北区/;
  const SCALE = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
  let alertTimer = 0, lastEew = "", lastQuake = "", lastQuakeScale = 0, curEew = "";

  const pt = s => { const t = Date.parse(String(s || "").replace(/\//g, "-").replace(" ", "T").slice(0, 19) + "+09:00"); return isFinite(t) ? t : null; };
  const stale = s => { const t = pt(s); return t !== null && Math.abs(now() - t) > 10 * 60 * 1000; };
  const hhmm = s => { const m = String(s || "").match(/(\d\d):(\d\d)/); return m ? `${+m[1]}:${m[2]}` : ""; };
  const mag = m => (m !== undefined && m !== null && m >= 0) ? ` M${Number(m).toFixed(1)}` : "";

  function showAlert(kind, title, main, sub, ms) {
    const el = $("alert");
    el.className = kind;
    $("atitle").textContent = title; $("amain").textContent = main; $("asub").textContent = sub;
    void el.offsetWidth; el.classList.add("show"); alertOn = true;
    $("dim").style.opacity = 0; // 夜間の減光を一時解除
    clearTimeout(alertTimer); alertTimer = setTimeout(hideAlert, ms);
  }
  function hideAlert() { clearTimeout(alertTimer); $("alert").classList.remove("show"); alertOn = false; curEew = ""; }

  function rangeText(from, to) {
    const a = SCALE[from] || "", b = SCALE[to] || "";
    if (to === 99) return (a || "3") + "以上";
    if (a && b && a !== b) return a + "〜" + b;
    return (b || a) + "程度";
  }

  function onEew(d) {
    if (d.test) return;
    const id = d.issue && d.issue.eventId;
    if (d.cancelled) { if (id && id === curEew) hideAlert(); return; }
    if (stale(d.time)) return;
    const a = (d.areas || []).find(x => EEW_AREA.test(x.name || "") && (x.scaleTo === 99 || x.scaleTo >= EQ_MIN));
    if (!a) return;
    const key = id + "-" + (d.issue && d.issue.serial);
    if (key === lastEew) return;
    lastEew = key; curEew = id || "";
    const h = (d.earthquake && d.earthquake.hypocenter) || {};
    showAlert("eew", "緊急地震速報(警報)", "震度" + rangeText(a.scaleFrom, a.scaleTo) + "の予想",
      `札幌市北区を含む石狩地方中部` + (h.name ? `\n震源 ${h.name}${mag(h.magnitude)}` : ""), 10000);
  }

  function onQuake(d) {
    if (stale(d.time)) return;
    const pts = (d.points || []).filter(p => !p.isArea && QUAKE_ADDR.test(p.addr || "") && p.scale >= EQ_MIN);
    if (!pts.length) return;
    const sc = Math.max(...pts.map(p => p.scale));
    const eq = d.earthquake || {}, key = eq.time || d.time;
    if (key === lastQuake && sc <= lastQuakeScale) return;
    lastQuake = key; lastQuakeScale = sc;
    const h = eq.hypocenter || {};
    showAlert("quake", "地震情報", `札幌市北区 震度${SCALE[sc] || "?"}`,
      `${hhmm(eq.time)}ごろ 震源 ${h.name || "調査中"}${mag(h.magnitude)}`, 8000);
  }

  function eqHandle(d) { if (d.code === 556) onEew(d); else if (d.code === 551) onQuake(d); }

  let ws = null, wsTimer = 0;
  function eqConnect() {
    clearTimeout(wsTimer);
    if (ws && ws.readyState <= 1) return;
    qState = 0; renderStatus();
    try { ws = new WebSocket(EQ_WS); } catch (e) { qState = 2; renderStatus(); wsTimer = setTimeout(eqConnect, 10000); return; }
    ws.onopen = () => { qState = 1; renderStatus(); };
    ws.onmessage = ev => { try { eqHandle(JSON.parse(ev.data)); } catch (e) {} };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
    ws.onclose = () => { qState = 2; renderStatus(); wsTimer = setTimeout(eqConnect, 10000); };
  }
  // 動作確認用: index.html?eqtest=eew または ?eqtest=quake
  const qt = new URLSearchParams(location.search).get("eqtest");
  if (qt) setTimeout(() => eqHandle(qt === "eew"
    ? { code: 556, time: "", issue: { eventId: "test", serial: "1" }, earthquake: { hypocenter: { name: "石狩地方中部", magnitude: 6.1 } }, areas: [{ name: "石狩地方中部", scaleFrom: 45, scaleTo: 99 }] }
    : { code: 551, time: "", earthquake: { time: "test", hypocenter: { name: "石狩地方中部", magnitude: 4.8 } }, points: [{ addr: "札幌北区新琴似", isArea: false, scale: 40 }] }), 2000);

  // ---- 背景スライドショー ----
  const BG_COUNT = 10, BG_INTERVAL = 10 * 1000; // background/1.jpeg 〜 10.jpeg
  const bgEls = [$("bgA"), $("bgB")], bgOk = [];
  let bgCur = 0, bgLast = 0, bgStarted = false;
  function bgShow() {
    if (!bgOk.length) return;
    const next = bgOk.find(n => n > bgLast) ?? bgOk[0];
    if (next === bgLast && bgOk.length === 1) return;
    bgLast = next;
    const nl = bgEls[bgCur ^ 1], ol = bgEls[bgCur];
    nl.style.backgroundImage = `url("background/${next}.jpeg")`;
    nl.classList.add("on"); ol.classList.remove("on");
    bgCur ^= 1;
  }
  for (let i = 1; i <= BG_COUNT; i++) {
    const im = new Image();
    im.onload = () => {
      bgOk.push(i); bgOk.sort((a, b) => a - b);
      if (!bgStarted) { bgStarted = true; bgShow(); setInterval(bgShow, BG_INTERVAL); }
    };
    im.src = `background/${i}.jpeg`; // 読み込めない画像は自動的にスキップ
  }

  // ---- ニュースのQRコード(タイトルをタップで表示、30秒または再タップで閉じる) ----
  let qrT = 0;
  function hideQR() { clearTimeout(qrT); $("qr").hidden = true; }
  function showQR(title, url) {
    const cv = $("qrcv");
    $("qrtitle").textContent = title; $("qrurl").textContent = url;
    cv.hidden = true;
    try {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      const n = qr.getModuleCount(), q = 4, sc = Math.max(4, Math.floor(640 / (n + 2 * q))), size = (n + 2 * q) * sc;
      cv.width = cv.height = size;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, size, size); g.fillStyle = "#000";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + q) * sc, (r + q) * sc, sc, sc);
      cv.hidden = false;
    } catch (e) { /* QRライブラリ未読込時はURLの文字のみ表示 */ }
    $("qr").hidden = false;
    clearTimeout(qrT); qrT = setTimeout(hideQR, 30000);
  }
  $("newslist").addEventListener("click", e => {
    const li = e.target.closest("li[data-link]");
    if (!li) return;
    e.stopPropagation(); // 全画面切替と区別
    showQR(li.textContent, li.dataset.link);
  });
  $("qr").addEventListener("click", e => { e.stopPropagation(); hideQR(); });

  // 全画面切替
  document.body.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.("landscape").catch(() => {})).catch(() => {});
  });

  // 画面スリープ防止
  let wl = null;
  async function keepAwake() { try { wl = await navigator.wakeLock?.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { keepAwake(); sync(); render(); weather(); news(); today(); eqConnect(); }
  });
  window.addEventListener("online", () => { sync(); weather(); news(); today(); eqConnect(); });

  keepAwake();
  render();
  relayout();
  sync();
  setInterval(sync, SYNC_INTERVAL);
  weather();
  setInterval(weather, WEATHER_INTERVAL);
  news();
  setInterval(news, NEWS_INTERVAL);
  today();
  eqConnect();

})();
</script>
</body>
</html>
