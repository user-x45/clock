<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時計</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { color-scheme: dark; --bg:#000; --fg:#f2f2f2; --sub:rgba(255,255,255,.95); --acc:#4fd1c5; --warn:#f6ad55; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  main { height: 100%; display: flex; flex-direction: row; align-items: stretch; gap: 2vw;
    padding: calc(2.5vh + env(safe-area-inset-top)) calc(3vw + env(safe-area-inset-right)) calc(4.5vh + env(safe-area-inset-bottom)) calc(3vw + env(safe-area-inset-left)); }
  #left { gap: 1.4vh; flex: 1.45; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #right { overflow: hidden; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.5vh; }
  .card { overflow: hidden; background: rgba(0,0,0,.28); border-radius: 12px; padding: 1.2vh 1.1vw; text-shadow: none; }
  .card h3 { font-size: min(1.4vw, 2.6vh); font-weight: 400; color: var(--sub); letter-spacing: .1em; margin-bottom: .6vh; }
  #hourly { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; text-align: center; font-size: min(1.9vw, 3.6vh); line-height: 1.25; }
  #hourly { font-family: "Montserrat", "Zen Kaku Gothic New", sans-serif; font-weight: 300; }
  #hourly .h, #hourly .p { color: var(--sub); font-size: .75em; }
  #hourly i { display: block; color: var(--acc); margin: .15em 0; }
  #tomorrow { display: flex; align-items: center; flex-wrap: wrap; gap: .2em .7em; font-size: min(2.3vw, 4.2vh); }
  #tomorrow i { color: var(--acc); } #tomorrow .p { color: var(--sub); font-size: .7em; }
  #newslist { list-style: none; padding: 0; }
  #newslist li { font-size: 1em; line-height: 1.35; padding: .5vh 0; border-bottom: 1px solid rgba(255,255,255,.12);
  }
  #newslist li:last-child { border-bottom: 0; }
  #time { font-family: "Montserrat", "Zen Kaku Gothic New", sans-serif; font-size: min(12.5vw, 32vh); font-weight: 300; line-height: 1; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #sec { font-size: .45em; color: var(--acc); margin-left: .08em; }
  #date { white-space: nowrap; line-height: 1.2; letter-spacing: .08em; font-size: min(3.4vw, 7vh); font-weight: 400; }
  #wday { margin-left: .5em; color: var(--acc); }
  #weather { line-height: 1.2; font-size: min(3vw, 6vh); font-weight: 500; color: var(--fg); white-space: nowrap; }
  #weather .city { color: var(--sub); font-size: .8em; font-weight: 500; margin-right: .6em; }
  #weather .wi { margin-right: .35em; color: var(--acc); }
  #today { white-space: nowrap; display: flex; align-items: baseline; justify-content: center; gap: .7em; font-size: min(2vw, 4vh); max-width: 100%; }
  #today[hidden] { display: none; }
  #today .lbl { font-size: .8em; font-weight: 500; color: var(--sub); white-space: nowrap; letter-spacing: .1em; }
  #todayname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .5s; }
  #weather.stale { opacity: .5; }
  #dayinfo, #weather2 { white-space: nowrap; line-height: 1.2; letter-spacing: .04em; }
  #dayinfo { display: flex; gap: .6em; justify-content: center; font-weight: 500; font-size: min(2vw, 4vh); }
  #dayinfo:empty, #weather2:empty { display: none; }
  #dayinfo .rk, #dayinfo .hol { padding: .1em .8em; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.22); }
  #dayinfo .rk { color: var(--fg); } #dayinfo .hol { color: #ffb3b3; border-color: rgba(255,155,155,.6); margin-left: 0; }
  /* 天気カード(現在・最高最低を1枚にまとめる) */
  #wx { display: flex; flex-direction: column; align-items: center; gap: .9vh; background: rgba(0,0,0,.28); border-radius: 14px; padding: 1.4vh 1.6vw; text-shadow: none; }
  #weather2 { font-size: min(2.2vw, 4.4vh); font-weight: 500; color: var(--fg); } #weather2 .hi { color: #ff9b8a; } #weather2 .lo { color: #8ec8ff; } #weather2 .k { color: var(--sub); font-size: .8em; margin: 0 .3em 0 .9em; } #weather2 i { color: var(--acc); margin-right: .3em; }
  #garbage { display: flex; flex-direction: column; align-items: center; gap: .25em; background: rgba(0,0,0,.28); border-radius: 12px; padding: .3em .9em; font-size: min(3vw, 6vh); text-shadow: none; }
  #garbage[hidden] { display: none; }
  #garbage .g1, #garbage .g2 { white-space: nowrap; line-height: 1.25; }
  #garbage .g2 { font-size: .7em; color: var(--sub); }
  #garbage .lbl { font-size: .7em; font-weight: 500; color: var(--sub); letter-spacing: .1em; margin-right: .7em; }
  #garbage .g2 .lbl { font-size: 1em; margin-right: .5em; }
  #garbage .gi b { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .3em; vertical-align: -.02em; }
  #garbage .pl { margin: 0 .35em; opacity: .7; } #garbage .none { color: var(--sub); }
  #newslist li[data-link] { cursor: pointer; }
  #hourly, #tomorrow { cursor: pointer; }
  .card:has(#hourly), .card:has(#tomorrow) { cursor: pointer; }
  /* 天気の詳細表示(常時ダーク) */
  #wm { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.8); text-shadow: none; }
  #wm[hidden] { display: none; }
  #wbox { background: #1b1d22; color: #f2f2f2; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 2.4vh 2.4vw;
    width: min(90vw, 820px); max-width: 100%; max-height: 90vh; max-height: 90dvh; overflow: auto; display: flex; flex-direction: column; gap: 1.8vh; }
  #wtitle { font-size: min(2.8vw, 5vh); font-weight: 500; }
  #wtitle small { font-size: .55em; color: #b5bac1; margin-left: .8em; font-weight: 400; }
  #wsum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.2vh 1.6vw; }
  #wsum div { font-size: min(2.2vw, 4vh); white-space: nowrap; } #wsum span { display: block; font-size: .6em; color: #b5bac1; }
  #wtbl { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: min(2.2vw, 4vh); font-variant-numeric: tabular-nums; }
  #wtbl th { font-weight: 400; font-size: .7em; color: #b5bac1; text-align: left; padding: .4vh .6vw; }
  #wtbl td { padding: .7vh .6vw; border-top: 1px solid rgba(255,255,255,.12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wtbl th:nth-child(1) { width: 18%; } #wtbl th:nth-child(2) { width: 38%; } #wtbl th:nth-child(3) { width: 18%; } #wtbl th:nth-child(4) { width: 26%; }
  #wtbl i { margin-right: .3em; }
  @media (orientation: portrait) {
    #wsum { grid-template-columns: repeat(2, 1fr); } #wsum div { font-size: 4vw; } #wtitle { font-size: 5vw; }
    #wtbl { font-size: 4vw; } #wsum div { white-space: normal; } #wbox { padding: 2vh 4vw; }
  }
  /* ニュース記事の表示(プロキシ経由)とQRコード */
  #qr { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.85); text-shadow: none; }
  #qr[hidden] { display: none; }
  #qrbox { background: #1b1d22; color: #f2f2f2; border: 1px solid rgba(255,255,255,.14); border-radius: 16px;
    width: min(96vw, 1300px); height: 92vh; height: 92dvh; padding: 1.6vh 1.2vw; display: flex; gap: 1.6vw; overflow: hidden; }
  #artf { flex: 1 1 0; min-width: 0; height: 100%; border: 0; border-radius: 10px; background: #14161a; }
  #qrside { flex: 0 0 min(24vw, 40vh); display: flex; flex-direction: column; align-items: center; gap: 1.6vh; overflow: auto; }
  #qrcv { width: 100%; height: auto; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; }
  #qrcv[hidden] { display: none; }
  #qrtxt { width: 100%; flex: 1; display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; }
  #qrtitle { font-size: min(1.5vw, 2.8vh); font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  #qrnote { font-size: min(1.15vw, 2.1vh); color: #b5bac1; line-height: 1.5; }
  #qrclose { margin-top: auto; font: inherit; font-size: min(1.5vw, 2.8vh); color: #f2f2f2; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: .8vh 1.2vw; cursor: pointer; }
  #qrclose:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  @media (orientation: portrait) {
    #qrbox { flex-direction: column; padding: 1.4vh 3vw; gap: 1.4vh; }
    #qrside { flex: none; flex-direction: row; width: 100%; align-items: center; gap: 3vw; }
    #qrcv { width: min(30vw, 16vh); flex: none; }
    #qrtitle { font-size: 3.4vw; -webkit-line-clamp: 3; } #qrnote { font-size: 2.6vw; } #qrclose { font-size: 3.4vw; padding: .8vh 4vw; margin-top: 0; align-self: flex-start; }
  }
  /* 時間帯ごとの背景(早朝5-9 / 昼9-16 / 夕方16-19 / 夜19-5) */
  body[data-p="morning"] { --fg:#fffaf0; --sub:rgba(255,255,255,.95); --acc:#fff0c2; }
  body[data-p="day"]     { --fg:#ffffff; --sub:rgba(255,255,255,.95); --acc:#ffe58a; }
  body[data-p="evening"] { --fg:#fff7ee; --sub:rgba(255,255,255,.95); --acc:#ffd89b; }
  .bg { position: fixed; inset: 0; opacity: 0; transition: opacity 4s; z-index: 0; pointer-events: none; }
  #bg-morning { background: linear-gradient(180deg, #1f2f52 0%, #7a4560 55%, #a8694a 100%); }
  #bg-day     { background: linear-gradient(180deg, #0f3560 0%, #1f5a8f 55%, #3a7fb0 100%); }
  #bg-evening { background: linear-gradient(180deg, #1c1438 0%, #6e2a3c 55%, #a8602c 100%); }
  #bg-night   { background: linear-gradient(180deg, #000106 0%, #040b18 60%, #08142b 100%); }
  #bg-night::after { content: ""; position: absolute; inset: 0; opacity: .8;
    background-image:
      radial-gradient(1.2px 1.2px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 80px 120px, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 140px 60px, #fff, transparent),
      radial-gradient(1px 1px at 190px 170px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 40px 180px, #dfe9ff, transparent),
      radial-gradient(1px 1px at 120px 200px, #fff, transparent);
    background-size: 220px 220px; }
  body[data-p="morning"] #bg-morning, body[data-p="day"] #bg-day,
  body[data-p="evening"] #bg-evening, body[data-p="night"] #bg-night { opacity: 1; }
  main { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,.75), 0 2px 14px rgba(0,0,0,.55); }
  /* 夜間モード: 黒背景に時刻のみ */
  body.nm .bg { opacity: 0 !important; }
  body.nm #right, body.nm #date, body.nm #dayinfo, body.nm #wx, body.nm #weather, body.nm #weather2, body.nm #garbage, body.nm #today, body.nm #status { display: none !important; }
  body.nm main { text-shadow: none; }
  #greet { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; text-align: center;
    background: rgba(0,0,0,.6); color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.6); font-size: min(8vw, 14vh); font-weight: 300; letter-spacing: .12em;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }
  #greet.show { opacity: 1; }
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; z-index: 10; }
  #status { z-index: 2; text-shadow: 0 1px 6px rgba(0,0,0,.4); position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--sub); }
  #status.warn { color: var(--warn); }
  /* 地震通知 */
  #alert { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none; text-align: center; color: #fff;
    display: flex; flex-direction: column; gap: .6vh; padding: calc(2.5vh + env(safe-area-inset-top)) 4vw 2.5vh;
    border-radius: 0 0 18px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.45); text-shadow: none;
    transform: translateY(-110%); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  #alert.show { transform: translateY(0); }
  #alert.eew { background: rgba(190,20,20,.97); }
  #alert.quake { background: rgba(200,95,10,.97); }
  #atitle { font-size: min(2.2vw, 4vh); font-weight: 500; letter-spacing: .15em; }
  #amain { font-size: min(5.5vw, 11vh); font-weight: 500; line-height: 1.15; }
  #asub { font-size: min(2.4vw, 4.4vh); font-weight: 400; line-height: 1.35; white-space: pre-line; }
  @media (orientation: portrait) {
    main::before { content: "横向きにしてください"; position: fixed; top: 12px; font-size: 13px; color: var(--sub); }
    #time { font-size: 17vw; }
    #date { font-size: 5vw; }
    #weather { font-size: 5vw; }
    #right { display: none; }
    main { flex-direction: column; }
  }
</style>
</head>
<body data-p="night">
<div class="bg" id="bg-morning"></div><div class="bg" id="bg-day"></div><div class="bg" id="bg-evening"></div><div class="bg" id="bg-night"></div>
<main>
  <div id="left">
    <div id="time">--:--<span id="sec">--</span></div>
    <div id="date">----年--月--日<span id="wday">-曜日</span></div>
    <div id="dayinfo"></div>
    <div id="wx">
      <div id="weather"><span class="city">札幌</span>天気を取得中…</div>
      <div id="weather2"></div>
    </div>
    <div id="garbage" hidden><div class="g1"></div><div class="g2"></div></div>
    <div id="today" hidden><span class="lbl">今日は何の日</span><span id="todayname"></span></div>
  </div>
  <div id="right">
    <div class="card"><h3>これからの天気(2時間ごと)</h3><div id="hourly"></div></div>
    <div class="card"><h3>明日の天気</h3><div id="tomorrow">取得中…</div></div>
    <div class="card"><h3 id="newsh">ニュース</h3><ul id="newslist"><li>取得中…</li></ul></div>
  </div>
</main>
<div id="wm" hidden><div id="wbox"><div id="wtitle"></div><div id="wsum"></div><table id="wtbl"></table></div></div>
<div id="qr" hidden><div id="qrbox"><iframe id="artf" title="記事" sandbox referrerpolicy="no-referrer"></iframe><div id="qrside"><canvas id="qrcv"></canvas><div id="qrtxt"><div id="qrtitle"></div><div id="qrnote">本文だけを抜き出したリーダー表示です。うまく表示されないときや、スマートフォンで読むときは、QRコードを読み取ってください。</div><button id="qrclose" type="button">閉じる</button></div></div></div></div>
<div id="alert"><div id="atitle"></div><div id="amain"></div><div id="asub"></div></div>
<div id="greet"></div>
<div id="dim"></div>
<div id="status">時刻を同期中…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
  const SYNC_INTERVAL = 5 * 60 * 1000;   // 5分ごとに同期
  const SAMPLES = 3;                      // 往復遅延が最小のサンプルを採用
  // 夜間の自動減光(端末のローカル時刻)
  const NIGHT_START = 0;   // 0:00から
  const NIGHT_END = 5;     // 5:00まで
  const DIM_LEVEL = 0;     // 暗さ(0〜1、大きいほど暗い)。0で夜間も減光しない
  const GREET_MS = 10 * 1000; // あいさつの表示時間
  let prevNight = null, greetUntil = 0;

  // 時刻ソース(順番に試行、失敗したら次へ)
  // 小数秒を3桁に揃えてからパース
  const iso = (t, utc) => Date.parse(String(t).replace(/(\.\d{3})\d+/, "$1") + (utc && !/[zZ]|[+-]\d\d:?\d\d$/.test(t) ? "Z" : ""));
  const SOURCES = [
    { url: "https://timeapi.io/api/time/current/zone?timeZone=UTC",
      parse: async r => { const j = await r.json(); return iso(j.dateTime || j.currentLocalTime, true); } },
    { url: "https://time.now/developer/api/timezone/Etc/UTC",
      parse: async r => { const j = await r.json(); return iso(j.utc_datetime || j.datetime, true); } }
  ];

  let nLast = 0, nErr = false, lastDay = null;
  let qState = 0, alertOn = false; // qState: 0=接続中 1=接続済 2=切断
  let offset = 0, lastSync = null, lastErr = false, accuracy = null;
  const $ = id => document.getElementById(id);
  const now = () => Date.now() + offset;

  // 取得失敗時の再試行(10秒後 → 30秒後 → 1分後。それでも失敗なら次の定期取得を待つ)
  const RETRY_DELAYS = [10000, 30000, 60000];
  const retryN = {}, retryT = {};
  function retryLater(name, fn) {
    const n = retryN[name] || 0;
    clearTimeout(retryT[name]);
    if (n >= RETRY_DELAYS.length) { retryN[name] = 0; return; }
    retryN[name] = n + 1;
    retryT[name] = setTimeout(fn, RETRY_DELAYS[n]);
  }
  function retryOk(name) { retryN[name] = 0; clearTimeout(retryT[name]); }

  async function sample(src) {
    const t0 = performance.now();
    const r = await fetch(src.url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const ms = await src.parse(r);
    if (!isFinite(ms)) throw new Error("parse");
    const rtt = performance.now() - t0;
    return { rtt, offset: ms + rtt / 2 - Date.now() };
  }

  async function sync() {
    for (const src of SOURCES) {
      try {
        const results = [];
        for (let i = 0; i < SAMPLES; i++) results.push(await sample(src));
        const best = results.reduce((a, b) => a.rtt < b.rtt ? a : b);
        offset = best.offset;
        accuracy = best.rtt / 2;
        lastSync = Date.now();
        lastErr = false; retryOk("sync");
        return renderStatus();
      } catch (e) { /* 次のソースへ */ }
    }
    lastErr = true; retryLater("sync", sync);
    renderStatus();
  }

  const p2 = n => String(n).padStart(2, "0");
  const WD = ["日","月","火","水","木","金","土"];

  function render() {
    const d = new Date(now());
    $("time").firstChild.nodeValue = p2(d.getHours()) + ":" + p2(d.getMinutes());
    $("sec").textContent = p2(d.getSeconds());
    $("date").firstChild.nodeValue = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    $("wday").textContent = WD[d.getDay()] + "曜日";
    // 日付が変わった瞬間に天気・ニュース・今日は何の日をまとめて再取得
    const dk = d.getDate();
    if (lastDay !== null && dk !== lastDay) { weather(); news(); today(); renderDay(); holidays(); rokuyoFetch(); }
    lastDay = dk;
    const h = d.getHours();
    document.body.dataset.p = h >= 5 && h < 9 ? "morning" : h >= 9 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night";
    const night = NIGHT_START > NIGHT_END ? (h >= NIGHT_START || h < NIGHT_END) : (h >= NIGHT_START && h < NIGHT_END);
    // 夜間モードの前後にあいさつを表示(おやすみなさい → 表示後に夜間モードへ / おはようございます)
    if (prevNight !== null && night !== prevNight) {
      greetUntil = now() + GREET_MS;
      $("greet").textContent = night ? "おやすみなさい" : "おはようございます";
      $("greet").classList.add("show");
    }
    prevNight = night;
    const greeting = now() < greetUntil;
    if (!greeting) $("greet").classList.remove("show");
    const nmOn = night && !greeting; // おやすみなさい表示中は通常画面のまま
    document.body.classList.toggle("nm", nmOn);
    $("dim").style.opacity = (nmOn && !alertOn) ? DIM_LEVEL : 0;
    setTimeout(render, 1000 - (now() % 1000) + 5); // 秒の境界に合わせて更新
  }

  function renderStatus() {
    const el = $("status");

    const day = kind === "hourly" ? 0 : 1, idx = [];
    if (day === 0) { const i0 = H.time.findIndex(t => t > c.time); if (i0 < 0) return; for (let k = 0; k < 6; k++) if (i0 + k * 3 < H.time.length) idx.push(i0 + k * 3); }
    else for (let h = 6; h < 24; h += 3) idx.push(24 + h);
    const [ic, lb, co] = WMAP(D.weather_code[day], true);
    const sum = [
      ["天気", `<i class="fa-solid ${ic}" style="color:${co}"></i> ${lb}`],
      ["最高 / 最低", `${R(D.temperature_2m_max[day])}° / ${R(D.temperature_2m_min[day])}°`],
      ["降水確率", `${D.precipitation_probability_max[day]}%`],
      ["最大風速", `${Math.round(D.wind_speed_10m_max[day])}m/s`]
    ];
    $("wtitle").innerHTML = (day === 0 ? "これからの天気<small>今日のまとめと3時間ごとの予報</small>" : "明日の天気<small>3時間ごとの予報</small>");
    $("wsum").innerHTML = sum.map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join("");
    $("wtbl").innerHTML = "<tr><th>時刻</th><th>天気</th><th>気温</th><th>降水確率</th></tr>" +
      idx.map(i => {
        const hr = parseInt(H.time[i].slice(11, 13), 10), [ic2, lb2, co2] = WMAP(H.weather_code[i], hr >= 6 && hr < 18);
        return `<tr><td>${hr}時</td><td><i class="fa-solid ${ic2}" style="color:${co2}"></i>${lb2}</td><td>${R(H.temperature_2m[i])}°</td><td>${H.precipitation_probability[i]}%</td></tr>`;
      }).join("");
    $("wm").hidden = false;
    clearTimeout(wmT); wmT = setTimeout(hideW, 30000);
  }
  $("hourly").parentElement.addEventListener("click", e => { e.stopPropagation(); showWeather("hourly"); });
  $("tomorrow").parentElement.addEventListener("click", e => { e.stopPropagation(); showWeather("tomorrow"); });
  $("wm").addEventListener("click", e => { e.stopPropagation(); hideW(); });

  // ---- ニュース記事の表示(プロキシ経由)とQRコード ----
  // タイトルをタップすると記事を画面内に表示し、同時にQRコードも出す(3分または「閉じる」で閉じる)
  const PROXY = "https://news-proxy.user-x45.workers.dev/";
  let qrT = 0;
  function hideQR() { clearTimeout(qrT); $("qr").hidden = true; $("artf").src = "about:blank"; }
  function showQR(title, url) {
    const cv = $("qrcv");
    $("qrtitle").textContent = title;
    $("artf").src = PROXY + "?url=" + encodeURIComponent(url);
    cv.hidden = true;
    try {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      const n = qr.getModuleCount(), q = 4, sc = Math.max(4, Math.floor(640 / (n + 2 * q))), size = (n + 2 * q) * sc;
      cv.width = cv.height = size;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, size, size); g.fillStyle = "#000";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + q) * sc, (r + q) * sc, sc, sc);
      cv.hidden = false;
    } catch (e) { /* QRライブラリ未読込時は記事の表示のみ */ }
    $("qr").hidden = false;
    clearTimeout(qrT); qrT = setTimeout(hideQR, 3 * 60 * 1000);
  }
  $("newslist").addEventListener("click", e => {
    const li = e.target.closest("li[data-link]");
    if (!li) return;
    e.stopPropagation(); // 全画面切替と区別
    showQR(li.textContent, li.dataset.link);
  });
  $("qr").addEventListener("click", e => { e.stopPropagation(); if (e.target.id === "qr" || e.target.id === "qrclose") hideQR(); });

  // 全画面切替
  // タップで全画面に入る(一度入ったらタップ・長押しでは解除しない。解除された場合は次のタップで再び全画面に戻る)
  document.body.addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.("landscape").catch(() => {})).catch(() => {});
  });
  document.addEventListener("contextmenu", e => e.preventDefault()); // 長押しメニューを無効化

  // 画面スリープ防止
  let wl = null;
  async function keepAwake() { try { wl = await navigator.wakeLock?.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { keepAwake(); sync(); render(); weather(); news(); today(); renderDay(); holidays(); rokuyoFetch(); eqConnect(); }
  });
  window.addEventListener("online", () => { sync(); weather(); news(); today(); garbageLoad(); holidays(); rokuyoFetch(); eqConnect(); });

  keepAwake();
  render();
  relayout();
  sync();
  setInterval(sync, SYNC_INTERVAL);
  weather();
  setInterval(weather, WEATHER_INTERVAL);
  news();
  setInterval(news, NEWS_INTERVAL);
  today();
  garbageLoad();
  holidays();
  rokuyoFetch();
  renderDay();
  eqConnect();

})();
</script>
</body>
</html>
