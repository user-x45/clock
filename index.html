<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時計</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#000; --fg:#f2f2f2; --sub:#9aa0a6; --acc:#4fd1c5; --warn:#f6ad55; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #time { font-size: min(24vw, 46vh); font-weight: 200; line-height: 1; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #sec { font-size: .45em; color: var(--acc); margin-left: .08em; }
  #date { margin-top: 2vh; font-size: min(6vw, 11vh); font-weight: 300; }
  #wday { margin-left: .5em; color: var(--acc); }
  #weather { margin-top: 2.5vh; font-size: min(4.6vw, 8.5vh); font-weight: 300; color: var(--fg); white-space: nowrap; }
  #weather .city { color: var(--sub); font-size: .6em; margin-right: .6em; }
  #weather .wi { margin-right: .35em; color: var(--acc); }
  #weather.stale { opacity: .5; }
  /* 時間帯ごとの背景(早朝5-9 / 昼9-16 / 夕方16-19 / 夜19-5) */
  body[data-p="morning"] { --fg:#fffaf0; --sub:rgba(255,255,255,.8); --acc:#fff0c2; }
  body[data-p="day"]     { --fg:#ffffff; --sub:rgba(255,255,255,.85); --acc:#ffe58a; }
  body[data-p="evening"] { --fg:#fff7ee; --sub:rgba(255,255,255,.8); --acc:#ffd89b; }
  .bg { position: fixed; inset: 0; opacity: 0; transition: opacity 4s; z-index: 0; pointer-events: none; }
  #bg-morning { background: linear-gradient(180deg, #3a5a8c 0%, #c8758f 55%, #f2a477 100%); }
  #bg-day     { background: linear-gradient(180deg, #1c63ad 0%, #4a9fe0 55%, #8fd0f5 100%); }
  #bg-evening { background: linear-gradient(180deg, #2f2257 0%, #b8435a 55%, #f59a4a 100%); }
  #bg-night   { background: linear-gradient(180deg, #01030a 0%, #07142b 60%, #0d2347 100%); }
  #bg-night::after { content: ""; position: absolute; inset: 0; opacity: .8;
    background-image:
      radial-gradient(1.2px 1.2px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 80px 120px, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 140px 60px, #fff, transparent),
      radial-gradient(1px 1px at 190px 170px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 40px 180px, #dfe9ff, transparent),
      radial-gradient(1px 1px at 120px 200px, #fff, transparent);
    background-size: 220px 220px; }
  body[data-p="morning"] #bg-morning, body[data-p="day"] #bg-day,
  body[data-p="evening"] #bg-evening, body[data-p="night"] #bg-night { opacity: 1; }
  main { position: relative; z-index: 1; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; z-index: 10; }
  #status { z-index: 2; text-shadow: 0 1px 6px rgba(0,0,0,.4); position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--sub); }
  #status.warn { color: var(--warn); }
  @media (orientation: portrait) {
    main::before { content: "横向きにしてください"; position: fixed; top: 12px; font-size: 13px; color: var(--sub); }
    #time { font-size: 17vw; }
    #date { font-size: 5vw; }
    #weather { font-size: 5vw; }
  }
</style>
</head>
<body data-p="night">
<div class="bg" id="bg-morning"></div><div class="bg" id="bg-day"></div><div class="bg" id="bg-evening"></div><div class="bg" id="bg-night"></div>
<main>
  <div id="time">--:--<span id="sec">--</span></div>
  <div id="date">----年--月--日<span id="wday">-曜日</span></div>
  <div id="weather"><span class="city">札幌</span>天気を取得中…</div>
</main>
<div id="dim"></div>
<div id="status">時刻を同期中…</div>

<script>
(() => {
  const SYNC_INTERVAL = 5 * 60 * 1000;   // 5分ごとに同期
  const SAMPLES = 3;                      // 往復遅延が最小のサンプルを採用
  // 夜間の自動減光(端末のローカル時刻)
  const NIGHT_START = 22;  // 22:00から
  const NIGHT_END = 6;     // 6:00まで
  const DIM_LEVEL = 0.75;  // 暗さ(0〜1、大きいほど暗い)

  // 時刻ソース(順番に試行、失敗したら次へ)
  // 小数秒を3桁に揃えてからパース
  const iso = (t, utc) => Date.parse(String(t).replace(/(\.\d{3})\d+/, "$1") + (utc && !/[zZ]|[+-]\d\d:?\d\d$/.test(t) ? "Z" : ""));
  const SOURCES = [
    { url: "https://timeapi.io/api/time/current/zone?timeZone=UTC",
      parse: async r => { const j = await r.json(); return iso(j.dateTime || j.currentLocalTime, true); } },
    { url: "https://time.now/developer/api/timezone/Etc/UTC",
      parse: async r => { const j = await r.json(); return iso(j.utc_datetime || j.datetime, true); } }
  ];

  let offset = 0, lastSync = null, lastErr = false, accuracy = null;
  const $ = id => document.getElementById(id);
  const now = () => Date.now() + offset;

  async function sample(src) {
    const t0 = performance.now();
    const r = await fetch(src.url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const ms = await src.parse(r);
    if (!isFinite(ms)) throw new Error("parse");
    const rtt = performance.now() - t0;
    return { rtt, offset: ms + rtt / 2 - Date.now() };
  }

  async function sync() {
    for (const src of SOURCES) {
      try {
        const results = [];
        for (let i = 0; i < SAMPLES; i++) results.push(await sample(src));
        const best = results.reduce((a, b) => a.rtt < b.rtt ? a : b);
        offset = best.offset;
        accuracy = best.rtt / 2;
        lastSync = Date.now();
        lastErr = false;
        return renderStatus();
      } catch (e) { /* 次のソースへ */ }
    }
    lastErr = true;
    renderStatus();
  }

  const p2 = n => String(n).padStart(2, "0");
  const WD = ["日","月","火","水","木","金","土"];

  function render() {
    const d = new Date(now());
    $("time").firstChild.nodeValue = p2(d.getHours()) + ":" + p2(d.getMinutes());
    $("sec").textContent = p2(d.getSeconds());
    $("date").firstChild.nodeValue = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    $("wday").textContent = WD[d.getDay()] + "曜日";
    const h = d.getHours();
    document.body.dataset.p = h >= 5 && h < 9 ? "morning" : h >= 9 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night";
    const night = NIGHT_START > NIGHT_END ? (h >= NIGHT_START || h < NIGHT_END) : (h >= NIGHT_START && h < NIGHT_END);
    $("dim").style.opacity = night ? DIM_LEVEL : 0;
    setTimeout(render, 1000 - (now() % 1000) + 5); // 秒の境界に合わせて更新
  }

  function renderStatus() {
    const el = $("status");
    const f = t => { const d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()); };
    const a = lastSync ? `時刻取得 ${f(lastSync)}` + (lastErr ? "(再取得失敗)" : "") : "時刻取得 失敗(端末時刻を表示中)";
    const b = wLast ? `天気取得 ${f(wLast)}` + (wErr ? "(再取得失敗)" : "") : (wErr ? "天気取得 失敗" : "天気取得中…");
    el.textContent = a + "  ・  " + b;
    el.className = (lastErr || wErr || !lastSync) ? "warn" : "";
  }


  // ---- 札幌の天気(Open-Meteo / APIキー不要) ----
  const WEATHER_INTERVAL = 10 * 60 * 1000; // 10分ごと
  const WURL = "https://api.open-meteo.com/v1/forecast?latitude=43.0621&longitude=141.3544&current=temperature_2m,apparent_temperature,weather_code,is_day&timezone=Asia%2FTokyo";
  // Font Awesome(Free Solid)アイコン。夜間は月アイコンに切替
  const WMAP = (c, day) => c === 0 ? [day ? "fa-sun" : "fa-moon", "快晴", day ? "#f6c945" : "#cbd5e0"]
    : c <= 2 ? [day ? "fa-cloud-sun" : "fa-cloud-moon", "晴れ", day ? "#f6c945" : "#cbd5e0"]
    : c === 3 ? ["fa-cloud", "曇り", "#a0aec0"]
    : c <= 48 ? ["fa-smog", "霧", "#a0aec0"]
    : c <= 57 ? ["fa-cloud-rain", "霧雨", "#63b3ed"]
    : c <= 67 ? ["fa-cloud-showers-heavy", "雨", "#4299e1"]
    : c <= 77 ? ["fa-snowflake", "雪", "#bee3f8"]
    : c <= 82 ? ["fa-cloud-sun-rain", "にわか雨", "#63b3ed"]
    : c <= 86 ? ["fa-snowflake", "にわか雪", "#bee3f8"]
    : ["fa-cloud-bolt", "雷雨", "#ecc94b"];
  let wLast = 0, wErr = false;
  async function weather() {
    const el = $("weather");
    try {
      const r = await fetch(WURL, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const c = (await r.json()).current;
      const [icon, label, color] = WMAP(c.weather_code, c.is_day === 1);
      el.innerHTML = `<span class="city">札幌</span><i class="fa-solid ${icon} wi"></i>${label} ${Math.round(c.temperature_2m)}°C` +
        `<span class="city" style="margin-left:.6em">体感 ${Math.round(c.apparent_temperature)}°C</span>`;
      el.className = "";
      wLast = Date.now(); wErr = false; renderStatus();
    } catch (e) {
      wErr = true; renderStatus();
      if (wLast) el.className = "stale"; // 取得失敗時は前回値を薄く表示
      else el.innerHTML = '<span class="city">札幌</span>天気を取得できません';
    }
  }

  // 全画面切替
  document.body.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.("landscape").catch(() => {})).catch(() => {});
  });

  // 画面スリープ防止
  let wl = null;
  async function keepAwake() { try { wl = await navigator.wakeLock?.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { keepAwake(); sync(); render(); weather(); }
  });
  window.addEventListener("online", () => { sync(); weather(); });

  keepAwake();
  render();
  sync();
  setInterval(sync, SYNC_INTERVAL);
  weather();
  setInterval(weather, WEATHER_INTERVAL);

})();
</script>
</body>
</html>
