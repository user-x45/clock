<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お知らせを送る</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#000; --panel:#1b1d22; --line:rgba(255,255,255,.14); --fg:#f2f2f2; --sub:#b5bac1; --acc:#4fd1c5; --warn:#f6ad55; --err:#fc8181; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6; padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 22px; font-weight: 500; }
  h1 + p, .hint { color: var(--sub); font-size: 13px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h2 { font-size: 15px; font-weight: 500; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h2 small { font-size: 12px; font-weight: 400; color: var(--sub); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--sub); }
  label span { display: flex; justify-content: space-between; }
  select { font: inherit; font-size: 16px; color: var(--fg); background: #101216; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  input, textarea { font: inherit; font-size: 16px; color: var(--fg); background: #101216; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; resize: vertical; -webkit-user-select: text; user-select: text; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  button { font: inherit; font-size: 16px; font-weight: 500; border-radius: 999px; border: 0; padding: 11px 20px; cursor: pointer; }
  #send { background: var(--acc); color: #06201d; } #send:disabled { opacity: .5; cursor: default; }
  #savekey { background: rgba(255,255,255,.12); color: var(--fg); border: 1px solid rgba(255,255,255,.3); padding: 9px 18px; }
  #msg { min-height: 1.6em; font-size: 13px; color: var(--sub); } #msg.ok { color: var(--acc); } #msg.err { color: var(--err); }
  #list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  #list li { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  #list li.read { border-color: rgba(79,209,197,.35); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--sub); }
  .chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--warn); }
  .chip.read { color: var(--acc); }
  .t { font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; } .b { font-size: 14px; color: #d5d8dd; white-space: pre-wrap; overflow-wrap: anywhere; }
  .acts { display: flex; align-items: center; gap: 12px; }
  #clear { font-size: 13px; font-weight: 400; padding: 4px 12px; background: none; color: var(--err); border: 1px solid rgba(252,129,129,.5); }
  #clear[hidden] { display: none; }
  .rt { display: flex; align-items: center; gap: 6px; }
  .del { font-size: 14px; font-weight: 400; padding: 6px 10px; margin: -6px -8px -6px 0; background: none; color: var(--sub); border-radius: 8px; }
  .empty { color: var(--sub); font-size: 14px; text-align: center; padding: 12px 0; }
  details summary { cursor: pointer; font-size: 14px; color: var(--sub); }
  details[open] summary { margin-bottom: 12px; } details > div { display: flex; flex-direction: column; gap: 12px; }
  #cv { display: none; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; object-fit: contain; } #cv.on { display: block; }
  #cstart { background: var(--acc); color: #06201d; } #cstop { background: rgba(255,255,255,.12); color: var(--fg); border: 1px solid rgba(255,255,255,.3); }
  #cstart[hidden], #cstop[hidden] { display: none; } #cstat { min-height: 1.4em; }
  #cmute { background: rgba(255,255,255,.12); color: var(--fg); border: 1px solid rgba(255,255,255,.3); } #cmute[hidden] { display: none; }
  #pad { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.82); display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  #pad[hidden] { display: none; }
  #padbox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  #padt { font-size: 16px; font-weight: 500; }
  #dots { display: flex; gap: 14px; height: 18px; align-items: center; }
  #dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sub); } #dots i.on { background: var(--acc); border-color: var(--acc); }
  #padmsg { min-height: 1.4em; font-size: 13px; color: var(--err); text-align: center; }
  #keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  #keys button { height: 56px; padding: 0; font-size: 22px; border-radius: 16px; background: rgba(255,255,255,.1); color: var(--fg); border: 1px solid var(--line);
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #keys button:active { background: rgba(255,255,255,.22); }
  #keys button.sm { font-size: 13px; background: none; border-color: transparent; color: var(--sub); }
</style>
</head>
<body>
<main>
  <div>
    <h1>お知らせを送る</h1>
    <p>送ると時計の画面に通知が出ます。時計で一覧を開くと既読になります。</p>
  </div>

  <section>
    <label><span>お知らせの内容<em id="bcount" style="font-style:normal"></em></span><textarea id="body" rows="5" maxlength="300"></textarea></label>
    <button id="send" type="button">送信する</button>
    <div id="msg" role="status"></div>
  </section>

  <section>
    <h2>送信済み<span class="acts"><small id="sum"></small><button id="clear" type="button" hidden>すべて削除</button></span></h2>
    <ul id="list"></ul>
  </section>

  <section>
    <h2>見守りカメラ<small id="cstat"></small></h2>
    <video id="cv" autoplay playsinline></video>
    <button id="cmute" type="button" hidden></button>
    <label><span>画質</span><select id="cq"><option value="low">低(通信量が少ない)</option><option value="mid">標準</option><option value="high">高(通信量が多い)</option></select></label>
    <button id="cstart" type="button">カメラを起動</button>
    <button id="cstop" type="button" hidden>停止</button>
    <p class="hint">時計のフロントカメラの映像とマイクの音声を流します。15分で自動停止します。画質を変えると映像が一度途切れます。<br>音声は、ハウリング(キーンという音)を検知すると、その周波数だけ自動で除去します。<br>選択中の画質: <span id="cqinfo"></span></p>
  </section>

</main>

<div id="pad" hidden role="dialog" aria-modal="true" aria-label="パスコード入力">
  <div id="padbox">
    <div id="padt">パスコードを入力</div>
    <div id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="padmsg" role="alert"></div>
    <div id="keys"></div>
  </div>
</div>

<script>
(() => {
  const API = "https://news-proxy.user-x45.workers.dev/api/notices";
  const POLL_MS = 5000; // 既読の反映を確認する間隔(画面を開いている間だけ)
  const $ = id => document.getElementById(id);

  const p2 = n => String(n).padStart(2, "0");
  const fmt = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${p2(d.getMinutes())}`; };
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  const say = (t, cls) => { $("msg").textContent = t; $("msg").className = cls || ""; };

  async function api(path, opt = {}) {
    const r = await fetch(API + path, { cache: "no-store", ...opt,
      headers: opt.body ? { "Content-Type": "application/json" } : {} });
    if (!r.ok) { let m = ""; try { m = (await r.json()).error || ""; } catch (e) {} throw Object.assign(new Error(m || r.status), { code: "http" }); }
    return r.json();
  }
  const errText = e => e.code === "http" ? e.message : "通信に失敗しました";

  function render(list) {
    const ul = $("list"); ul.textContent = "";
    const unread = list.filter(n => !n.readAt).length; lastIds = list.map(n => n.id);
    $("sum").textContent = list.length ? `未読 ${unread}件 / 既読 ${list.length - unread}件` : "";
    $("clear").hidden = !list.length;
    if (!list.length) { ul.appendChild(mk("li", "empty", "まだ送っていません")); return; }
    list.forEach(n => {
      const li = mk("li", n.readAt ? "read" : ""), row = mk("div", "row"), chip = mk("span", "chip" + (n.readAt ? " read" : ""));
      chip.appendChild(mk("i", "fa-solid " + (n.readAt ? "fa-check-double" : "fa-check")));
      chip.appendChild(document.createTextNode(n.readAt ? `既読 ${fmt(n.readAt)}` : "未読"));
      const del = mk("button", "del"); del.type = "button"; del.dataset.id = n.id; del.setAttribute("aria-label", "削除"); del.appendChild(mk("i", "fa-solid fa-trash-can"));
      const rt = mk("span", "rt"); rt.appendChild(chip); rt.appendChild(del);
      row.appendChild(mk("span", "", fmt(n.createdAt))); row.appendChild(rt);
      li.appendChild(row); if (n.title) li.appendChild(mk("div", "t", n.title));
      if (n.body) li.appendChild(mk("div", n.title ? "b" : "t", n.body));
      ul.appendChild(li);
    });
  }

  let busy = false, ver = 0, lastIds = []; // ver: 削除の前に始めた取得結果で一覧を上書きしないための番号
  async function load(quiet) {
    if (busy) return;
    busy = true;
    const v = ver;
    try { const j = await api(""); if (v === ver) render(j.notices || []); }
    catch (e) { if (!quiet) say(errText(e), "err"); }
    busy = false;
  }

  async function send() {
    const body = $("body").value.trim();
    if (!body) { say("内容を入力してください", "err"); $("body").focus(); return; }
    $("send").disabled = true; say("送信中…");
    try {
      const j = await api("", { method: "POST", body: JSON.stringify({ body }) });
      $("body").value = ""; count();
      render(j.notices || []); say("送信しました。時計には10秒ほどで届きます", "ok");
    } catch (e) { say(errText(e), "err"); }
    $("send").disabled = false;
  }

  function count() {
    $("bcount").textContent = `${$("body").value.length}/300`;
  }

  async function remove(ids) {
    if (!ids.length) return;
    ver++;
    try { const j = await api("/delete", { method: "POST", body: JSON.stringify({ ids }) }); ver++; render(j.notices || []); say("削除しました", "ok"); }
    catch (e) { say(errText(e), "err"); }
  }
  $("list").addEventListener("click", e => { const b = e.target.closest(".del"); if (b) remove([b.dataset.id]); });
  $("clear").addEventListener("click", () => { if (confirm("送信済みのお知らせをすべて削除しますか?時計の一覧からも消えます。")) remove(lastIds); });
  $("send").addEventListener("click", send);
  $("body").addEventListener("input", count);
  $("body").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") send(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });
  setInterval(() => { if (!document.hidden) load(true); }, POLL_MS);

  // ---- 見守りカメラ(時計のフロントカメラ映像をWebRTCで受信) ----
  const CAM = "wss://news-proxy.user-x45.workers.dev/api/cam", STUN = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
  let cws = null, cpc = null, cwant = false, cchain = Promise.resolve();
  const cst = (t, err) => { $("cstat").textContent = t; $("cstat").style.color = err ? "var(--err)" : ""; };
  const cSend = o => { try { cws.send(JSON.stringify(o)); } catch (e) {} };
  const gathered = pc => new Promise(res => {
    if (pc.iceGatheringState === "complete") return res();
    const f = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", f); res(); } };
    pc.addEventListener("icegatheringstatechange", f); setTimeout(res, 2500);
  });
  function cClosePc() { howlStop(); if (cpc) { try { cpc.close(); } catch (e) {} cpc = null; } $("cv").srcObject = null; $("cv").muted = true; $("cv").classList.remove("on"); $("cmute").hidden = true; }
  function updMute() { const b = $("cmute"); b.hidden = !$("cv").classList.contains("on"); b.textContent = isMuted() ? "音を出す" : "ミュートにする"; }
  $("cmute").addEventListener("click", () => { const m = !isMuted(); if (!m) ensureCtx(); setMute(m); });
  function cEnd(msg, err) {
    cwant = false; cClosePc();
    if (cws) { const w = cws; cws = null; w.onclose = null; try { w.close(); } catch (e) {} }
    $("cstart").hidden = false; $("cstop").hidden = true; cst(msg || "", err);
  }
  // ---- ハウリング除去: 鳴っている周波数だけを自動で削る(音声全体は止めない) ----
  // 受信音を Web Audio に通し、「同じ周波数の鋭い音が0.5秒続く」状態を見つけたら、その周波数に狭い除去フィルタを掛ける(最大6か所)。
  // 話し声は周波数が揺れ、周りにも倍音が並ぶので、鋭さ(隣との差)で区別している。除去しきれなければミュートする。
  let actx = null, hsrc = null, hnode = null, hout = null, hf = [], hused = 0, htimer = null, amute = false, pipe = false;
  const isMuted = () => pipe ? amute : $("cv").muted;
  function setMute(b) {
    amute = b;
    if (pipe) { hout.gain.value = b ? 0 : 1; $("cv").muted = true; } else { $("cv").muted = b; if (!b) $("cv").play().catch(() => {}); }
    updMute();
  }
  function ensureCtx() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume().catch(() => {}); } catch (e) {} }
  function howlStop() {
    clearInterval(htimer); htimer = null;
    try { if (hsrc) hsrc.disconnect(); hf.forEach(f => f.disconnect()); if (hnode) hnode.disconnect(); if (hout) hout.disconnect(); } catch (e) {}
    hsrc = hnode = hout = null; hf = []; hused = 0; pipe = false;
  }
  function howlStart(stream) {
    howlStop();
    try {
      if (!actx || !stream || !stream.getAudioTracks().length) return;
      hsrc = actx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
      let prev = hsrc;
      for (let i = 0; i < 6; i++) { const f = actx.createBiquadFilter(); f.type = "peaking"; f.frequency.value = 1000; f.Q.value = 15; f.gain.value = 0; prev.connect(f); prev = f; hf.push(f); }
      hnode = actx.createAnalyser(); hnode.fftSize = 2048; hnode.smoothingTimeConstant = 0; prev.connect(hnode); // フィルタ通過後の音を監視
      hout = actx.createGain(); hnode.connect(hout); hout.connect(actx.destination);
      pipe = true; $("cv").muted = true;
      if (actx.state !== "running") amute = true; // 自動再生が止められた場合は「音を出す」ボタンで開始
      hout.gain.value = amute ? 0 : 1;
      const node = hnode, buf = new Float32Array(node.frequencyBinCount); let last = -1, run = 0;
      htimer = setInterval(() => {
        if (isMuted()) { run = 0; last = -1; return; }
        node.getFloatFrequencyData(buf);
        let pk = 12, mx = -Infinity;
        for (let i = 12; i < buf.length - 12; i++) if (buf[i] > mx) { mx = buf[i]; pk = i; } // 約280Hz以上を見る
        let side = -Infinity; for (let d = 6; d <= 10; d++) side = Math.max(side, buf[pk - d], buf[pk + d]);
        const tonal = mx > -35 && mx - side > 20;
        if (tonal && (last < 0 || Math.abs(pk - last) <= 1)) run++; else run = tonal ? 1 : 0;
        last = tonal ? pk : -1;
        if (run < 5) return;
        run = 0; last = -1;
        const a = buf[pk - 1], b = buf[pk], c = buf[pk + 1], den = a - 2 * b + c, off = den ? Math.max(-.5, Math.min(.5, .5 * (a - c) / den)) : 0;
        const hz = (pk + off) * actx.sampleRate / node.fftSize;
        let f = hf.find((x, k) => k < hused && Math.abs(x.frequency.value - hz) < hz * .03);
        if (f) { if (f.gain.value <= -45) { setMute(true); cst("ハウリングを除去しきれないため音を止めました。時計とスマホを離してから「音を出す」を押してください", true); return; } f.gain.value = -45; }
        else if (hused < hf.length) { f = hf[hused++]; f.frequency.value = hz; f.gain.value = -30; }
        else { setMute(true); cst("ハウリングを除去しきれないため音を止めました。時計とスマホを離してから「音を出す」を押してください", true); return; }
        cst("ハウリングを検知: " + Math.round(hz) + "Hz付近を除去しました");
        setTimeout(() => { if (cpc) cst("映像を受信中"); }, 4000);
      }, 100);
    } catch (e) { pipe = false; }
  }
  // 音声コーデック(Opus)を高音質寄りに: 64kbps・モノラル・パケット欠損の補正(FEC)あり
  function opusHQ(sdp) {
    const m = sdp.match(/a=rtpmap:(\d+) opus\/48000/); if (!m) return sdp;
    const add = "maxaveragebitrate=64000;stereo=0;sprop-stereo=0;useinbandfec=1;usedtx=0";
    const re = new RegExp("a=fmtp:" + m[1] + " ([^\\r\\n]*)");
    if (re.test(sdp)) return sdp.replace(re, (x, p) => "a=fmtp:" + m[1] + " " + p.replace(/;?(maxaveragebitrate|stereo|sprop-stereo|useinbandfec|usedtx)=\d+/g, "").replace(/^;/, "") + ";" + add);
    return sdp.replace(new RegExp("(a=rtpmap:" + m[1] + " opus/48000[^\\r\\n]*)"), "$1\r\na=fmtp:" + m[1] + " " + add);
  }
  async function cOffer() {
    cClosePc();
    const pc = cpc = new RTCPeerConnection(STUN);
    pc.addTransceiver("video", { direction: "recvonly" }); pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = e => {
      const v = $("cv"); if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
      v.classList.add("on");
      if (e.track.kind === "audio") {
        howlStart(e.streams[0]);
        if (!pipe) { v.muted = amute; if (!amute) v.play().catch(() => { v.muted = true; amute = true; updMute(); }); } // Web Audio が使えない場合は通常再生
      }
      v.play().catch(() => {});
      updMute(); cst("映像を受信中");
    };
    pc.onconnectionstatechange = () => { if (cpc === pc && pc.connectionState === "failed") cEnd("接続できませんでした(回線によっては中継サーバー(TURN)が必要です)", true); };
    const off = await pc.createOffer();
    off.sdp = opusHQ(off.sdp);
    await pc.setLocalDescription(off);
    await gathered(pc);
    if (cpc !== pc) return;
    cSend({ t: "offer", sdp: pc.localDescription.sdp, q: $("cq").value }); cst("時計のカメラを起動中…");
  }
  async function cOn(m) {
    if (!cwant) return;
    if (m.t === "peer") { if (m.on) await cOffer(); else { cClosePc(); cst("時計に接続できません(電源・ネットワークを確認)", true); } }
    else if (m.t === "answer" && cpc && !cpc.remoteDescription) await cpc.setRemoteDescription({ type: "answer", sdp: m.sdp });
    else if (m.t === "bye") cEnd("配信が終了しました");
    else if (m.t === "err") cEnd(m.m || "カメラを起動できません", true);
  }
  let pin = "", authMsg = ""; // パスコードは保存せず、このページを開いている間だけメモリに保持する
  function cConnect() {
    cEnd(); cwant = true; authMsg = ""; amute = false; ensureCtx(); $("cstart").hidden = true; $("cstop").hidden = false; cst("接続中…");
    let w; try { w = cws = new WebSocket(CAM + "?role=view", ["pin." + pin]); } catch (e) { cEnd("接続できません", true); return; }
    w.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === "auth") { authMsg = m.locked ? "失敗が続いたため、しばらく使えません。時間をおいてやり直してください" : "パスコードが違います"; return; }
      cchain = cchain.then(() => cOn(m)).catch(() => {});
    };
    w.onclose = ev => {
      if (cws !== w) return;
      if (ev.code === 4001) { pin = ""; cEnd(); cst(""); openPad(authMsg || "パスコードが違います"); }
      else cEnd("接続できませんでした", true);
    };
  }
  function cStart() { if (pin) cConnect(); else openPad(""); }

  // ---- パスコード入力(OSのキーボードは出さず、画面内のボタンだけで入力) ----
  let padBuf = "";
  const padOpen = () => !$("pad").hidden;
  function padDraw() { [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < padBuf.length)); }
  function openPad(msg) { padBuf = ""; padDraw(); $("padmsg").textContent = msg || ""; $("pad").hidden = false; }
  function closePad() { $("pad").hidden = true; padBuf = ""; padDraw(); }
  function padDigit(d) {
    if (padBuf.length >= 6) return;
    padBuf += d; padDraw(); $("padmsg").textContent = "";
    if (padBuf.length === 6) { pin = padBuf; closePad(); cConnect(); }
  }
  function padBack() { padBuf = padBuf.slice(0, -1); padDraw(); }
  (() => {
    const keys = $("keys"), add = (label, fn, cls, aria) => { const b = mk("button", cls || "", label); b.type = "button"; if (aria) b.setAttribute("aria-label", aria); b.addEventListener("click", fn); keys.appendChild(b); };
    for (let n = 1; n <= 9; n++) add(String(n), () => padDigit(String(n)));
    add("キャンセル", () => { closePad(); cst(""); }, "sm");
    add("0", () => padDigit("0"));
    add("⌫", padBack, "sm", "1文字消す");
  })();
  document.addEventListener("keydown", e => { // パソコンの物理キーボード用(スマホではOSキーボードは出ません)
    if (!padOpen()) return;
    if (/^[0-9]$/.test(e.key)) padDigit(e.key); else if (e.key === "Backspace") padBack(); else if (e.key === "Escape") closePad();
  });
  try { const q = localStorage.getItem("camQ"); if (q && $("cq").querySelector(`option[value="${q}"]`)) $("cq").value = q; } catch (e) {}
  const QI = { low: "320×240 / 10fps / 約150kbps", mid: "640×480 / 15fps / 約600kbps", high: "1280×720 / 30fps / 約2Mbps" };
  const qinfo = () => { $("cqinfo").textContent = QI[$("cq").value] + "(映像の上限。実際は端末や回線で下がることがあります)"; };
  qinfo();
  $("cq").addEventListener("change", () => {
    qinfo();
    try { localStorage.setItem("camQ", $("cq").value); } catch (e) {}
    if (cwant && cws && cws.readyState === 1 && cpc) cchain = cchain.then(cOffer).catch(() => {}); // 配信中なら新しい画質で取り直す
  });
  $("cstart").addEventListener("click", cStart);
  $("cstop").addEventListener("click", () => cEnd("停止しました"));
  count(); load();
})();
</script>
</body>
</html>
