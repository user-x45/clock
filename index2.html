<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時計(デモ)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>
  :root { --fg:#fff; --sub:rgba(255,255,255,.78); --acc:#ffe58a; --card:rgba(0,0,0,.28);
    --bg-from:#0f3560; --bg-to:#3a7fb0; box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { color: var(--fg); background: linear-gradient(180deg, var(--bg-from), var(--bg-to)); transition: background 2s;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
  body[data-p="morning"] { --bg-from:#1f2f52; --bg-to:#a8694a; --acc:#fff0c2; }
  body[data-p="evening"] { --bg-from:#1c1438; --bg-to:#a8602c; --acc:#ffd89b; }
  body[data-p="night"]   { --bg-from:#000106; --bg-to:#08142b; --acc:#4fd1c5; }
  main { min-height: 100%; display: flex; gap: 3vw; padding: 4vh 4vw 9vh; align-items: center; }
  #left { flex: 1.45; display: flex; flex-direction: column; align-items: center; gap: 2vh; min-width: 0; }
  #right { flex: 1; display: flex; flex-direction: column; gap: 1.6vh; min-width: 0; }
  #time { font-size: min(13vw, 30vh); font-weight: 200; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #sec { font-size: .45em; color: var(--acc); }
  #date { font-size: min(3.4vw, 7vh); font-weight: 300; letter-spacing: .08em; white-space: nowrap; }
  #date b { font-weight: 300; color: var(--acc); margin-left: .5em; }
  #wx { font-size: min(3vw, 6vh); font-weight: 300; white-space: nowrap; }
  #wx small { color: var(--sub); font-size: .6em; margin-right: .5em; }
  .card { background: var(--card); border-radius: 12px; padding: 1.6vh 1.6vw; }
  .card h2 { font-size: min(1.5vw, 2.8vh); font-weight: 400; color: var(--sub); margin-bottom: .8vh; }
  #hourly { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-size: min(3vw, 5.4vh); line-height: 1.3; }
  #hourly span { display: block; color: var(--sub); font-size: .72em; }
  #news { list-style: none; padding: 0; font-size: min(2vw, 3.8vh); line-height: 1.4; }
  #news li { padding: .8vh 0; border-bottom: 1px solid rgba(255,255,255,.14); }
  #news li:last-child { border-bottom: 0; }
  #demonote { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 12px; color: var(--sub); }
  #alert { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none; text-align: center; color: #fff;
    display: flex; flex-direction: column; gap: .6vh; padding: calc(2.5vh + env(safe-area-inset-top, 0px)) 4vw 2.5vh;
    border-radius: 0 0 18px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transform: translateY(-110%); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  #alert.show { transform: translateY(0); }
  #alert.eew { background: rgba(190,20,20,.97); }
  #alert.quake { background: rgba(200,95,10,.97); }
  @media (prefers-reduced-motion: reduce) { #alert { transition: none; } body { transition: none; } }
  #at { font-size: min(2.2vw, 4vh); font-weight: 500; letter-spacing: .15em; }
  #am { font-size: min(5.5vw, 11vh); font-weight: 500; line-height: 1.15; }
  #as { font-size: min(2.4vw, 4.4vh); line-height: 1.35; white-space: pre-line; }
  @media (orientation: portrait), (max-width: 700px) {
    main { flex-direction: column; padding-top: 6vh; }
    #time { font-size: 19vw; } #date { font-size: 5vw; } #wx { font-size: 5vw; }
    #hourly, #news { font-size: 3.6vw; } .card h2 { font-size: 3vw; }
    #am { font-size: 9vw; } #at { font-size: 4vw; } #as { font-size: 3.8vw; }
  }
</style>
</head>
<body data-p="day">
<main>
  <div id="left">
    <div id="time">--:--<span id="sec">--</span></div>
    <div id="date">----年--月--日<b id="wd"></b></div>
    <div id="wx"><small>札幌</small>☀️ 快晴 8°C<small style="margin-left:.6em">体感 6°C</small></div>
  </div>
  <div id="right">
    <div class="card"><h2>これからの天気(2時間ごと)</h2>
      <div id="hourly">
        <div><span>14時</span>☀️<br>9°<span>0%</span></div><div><span>16時</span>⛅<br>7°<span>10%</span></div>
        <div><span>18時</span>☁️<br>5°<span>20%</span></div><div><span>20時</span>☁️<br>4°<span>30%</span></div>
      </div></div>
    <div class="card"><h2>明日の天気</h2><div style="font-size:min(2.3vw,4.2vh)">🌨️ 雪 &nbsp;3° / -2° <span style="color:var(--sub);font-size:.7em">降水確率 70%</span></div></div>
    <div class="card"><h2>今日のニュース(サンプル)</h2>
      <ul id="news">
        <li>札幌で初雪を観測 平年より4日遅く</li>
        <li>道内の鉄道 週末に一部区間で運転見合わせ</li>
        <li>冬の電力需給 道内は安定的に推移の見通し</li>
      </ul></div>
  </div>
</main>

<p id="demonote">デモ表示:通知が自動で繰り返し出ます(固定データ・実際の情報は取得していません)</p>

<div id="alert" role="alert" aria-live="assertive"><div id="at"></div><div id="am"></div><div id="as"></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const p2 = n => String(n).padStart(2, "0");
  const WD = ["日","月","火","水","木","金","土"];
  function tick() {
    const d = new Date();
    $("time").firstChild.nodeValue = p2(d.getHours()) + ":" + p2(d.getMinutes());
    $("sec").textContent = p2(d.getSeconds());
    $("date").firstChild.nodeValue = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    $("wd").textContent = WD[d.getDay()] + "曜日";
    const h = d.getHours();
    document.body.dataset.p = h >= 5 && h < 9 ? "morning" : h >= 9 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night";
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  let timer = 0;
  function show(kind, t, m, s, ms) {
    const el = $("alert");
    el.className = kind; $("at").textContent = t; $("am").textContent = m; $("as").textContent = s;
    void el.offsetWidth; el.classList.add("show"); clearTimeout(timer); timer = setTimeout(hide, ms);
  }
  function hide() { clearTimeout(timer); $("alert").classList.remove("show"); }
  // 約14秒ごとに、緊急地震速報と震度情報を交互に自動表示(各8秒)
  let n = 0;
  function demo() {
    if (n++ % 2 === 0) show("eew", "緊急地震速報(警報)", "震度4〜5弱の予想", "札幌市北区を含む石狩地方中部\n震源 石狩地方中部 M5.8", 8000);
    else show("quake", "地震情報", "札幌市北区 震度4", "14:32ごろ 震源 石狩地方中部 M4.8", 8000);
  }
  setTimeout(demo, 2500);
  setInterval(demo, 14000);
})();
</script>
</body>
</html>
